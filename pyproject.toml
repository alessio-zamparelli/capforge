[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capforge"
version = "0.2.0"
description = "Deterministic, versioned capabilities exposed over MCP for Open WebUI + Open Terminal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["fastmcp>=4.1.3"]

[dependency-groups]
# `uv sync` installs this group by default; CI and local development rely on it.
# The Docker image explicitly passes --no-dev.
dev = [
    "httpx>=0.27",
    "mypy>=2.4.1",
    "pytest>=8.0",
    "ruff>=0.17.2",
]

[project.scripts]
capforge = "capforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["capforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end tests that build real virtualenvs and subprocesses",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
