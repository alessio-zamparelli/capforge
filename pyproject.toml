[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capforge"
version = "0.1.0"
description = "Deterministic, versioned capabilities exposed over MCP for Open WebUI + Open Terminal"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.0.0"]

[dependency-groups]
# `uv sync` installs this group by default; CI and local development rely on it.
# The Docker image explicitly passes --no-dev.
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
capforge = "capforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["capforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
