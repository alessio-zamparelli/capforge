[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capforge"
version = "0.7.1"
description = "Deterministic, versioned capabilities exposed over MCP for Open WebUI + Open Terminal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["fastmcp>=4.2.0", "httpx>=0.28.1", "starlette>=0.41"]

[dependency-groups]
# `uv sync` installs this group by default; CI and local development rely on it.
# The Docker image explicitly passes --no-dev.
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]

[project.scripts]
capforge = "capforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["capforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# xdist is safe: every test owns its temp caps/state dirs and the stray sweep is
# per-process (see AGENTS.md). Pass -n0 to debug a single test serially.
addopts = "-ra -n auto"
markers = [
    "slow: end-to-end tests that build real virtualenvs and subprocesses",
]

[tool.coverage.run]
source = ["capforge"]
branch = true

[tool.coverage.report]
omit = ["tests/*"]
# Measured full-suite baseline: 72.38%; keep the floor just below and ratchet upward.
fail_under = 71

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
