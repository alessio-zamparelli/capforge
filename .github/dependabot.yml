# Dependabot: keep GitHub Actions, Python dependencies and the base image
# current. See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # `@vN` action refs (immutable commit-SHA pinning is a separate hardening
    # step) — Dependabot opens PRs for new majors/minors automatically.
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    # Tracks pyproject.toml and uv.lock. Runtime dependencies are fastmcp,
    # starlette and httpx; pytest/ruff/mypy are in the dev group.
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    cooldown:
      default-days: 7

  - package-ecosystem: "bun"
    directory: "/ui"
    # The console bundle's dependencies (react, vite, tailwind).
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ui"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/"
    # Keeps the python:3.14-slim and oven/bun base images current.
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 7
