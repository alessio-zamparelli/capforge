name: Deploy container to GHCR

# Pin the runner image instead of `ubuntu-latest`: GitHub is migrating that
# label to Ubuntu 26.04 between October 19 and November 19, 2026
# (actions/runner-images#14748). Pinning keeps CI reproducible regardless of
# where a given runner is in the rollout. Keep both jobs on the same image.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only publish if the suite still passes. The tests build real venvs and
  # execute real capability subprocesses, so this is a meaningful gate.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Install a uv-managed Python for the test job instead of borrowing the
      # runner image's system interpreter. Without this, setup-uv's
      # cache-python has nothing to cache and logs a "no managed Python
      # installation was found" warning.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          # Keep in sync with the uv image tag in the Dockerfile.
          version: "0.13.9"
          python-version: "3.14"
          # Cache the uv download cache and the managed Python 3.14 install.
          # Keying on uv.lock (not pyproject.toml) avoids invalidation on
          # metadata-only edits; --locked still fails on real drift.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-python: true

      - name: Sync environment from lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked mypy capforge

      - name: Run test suite
        # xdist is already a dev dependency; each test owns its temp dirs and
        # stray sweeps are per-process, so -n auto is safe (see AGENTS.md).
        run: >-
          uv run --locked pytest -q -n auto --durations=10
          --cov=capforge --cov-branch --cov-fail-under=71

      - name: MCP and web round-trip probe
        env:
          CAPFORGE_MCP_TOKEN: ci-probe-token
          CAPFORGE_CAPS_DIR: ${{ runner.temp }}/capforge-probe/caps
          CAPFORGE_STATE_DIR: ${{ runner.temp }}/capforge-probe/state
          CAPFORGE_PORT: "18099"
          CAPFORGE_WEB_PORT: "18080"
          CAPFORGE_SANDBOX: warn
          CAPFORGE_PUBLIC_URL: http://127.0.0.1:18080
        run: |
          mkdir -p "$CAPFORGE_CAPS_DIR" "$CAPFORGE_STATE_DIR"
          uv run --locked capforge serve > "$RUNNER_TEMP/capforge-probe.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/readyz
          CAPFORGE_URL=http://127.0.0.1:18099/mcp \
          CAPFORGE_WEB_PROBE_URL=http://127.0.0.1:18080 \
            uv run --locked python tools/mcp_probe.py

  # The console bundle is part of the image; a broken build must not publish.
  ui:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
        working-directory: ui

      - name: Type check and build
        run: bun run build
        working-directory: ui

  build-and-push:
    runs-on: ubuntu-26.04
    needs:
      - test
      - ui
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The sha fallback keeps workflow_dispatch runs on non-main refs publishable.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Namespaced so this workflow does not share layers with any future
          # workflow that also uses the GitHub Actions cache backend.
          cache-from: type=gha,scope=capforge
          cache-to: type=gha,mode=max,scope=capforge

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
