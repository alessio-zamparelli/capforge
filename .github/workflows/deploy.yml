name: Deploy container to GHCR

# Pin the runner image instead of `ubuntu-latest`: GitHub is migrating that
# label to Ubuntu 26.04 between October 19 and November 19, 2026
# (actions/runner-images#14748). Pinning keeps CI reproducible regardless of
# where a given runner is in the rollout. Keep both jobs on the same image.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only publish if the suite still passes. The tests build real venvs and
  # execute real capability subprocesses, so this is a meaningful gate.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Keep in sync with the uv image tag in the Dockerfile.
          version: "0.12.24"
          python-version: "3.14"
          # Cache the uv download cache and the managed Python 3.14 install.
          # Keying on uv.lock (not pyproject.toml) avoids invalidation on
          # metadata-only edits; --locked still fails on real drift.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-python: true

      # Capability venvs are built with pip by the test suite, outside uv.
      # Cache the wheels those installs download (pytest, six, ...).
      - name: Cache pip downloads for capability venvs
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Sync environment from lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked mypy capforge

      - name: Run test suite
        run: uv run --locked pytest -q

  build-and-push:
    runs-on: ubuntu-26.04
    needs: test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The sha fallback keeps workflow_dispatch runs on non-main refs publishable.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Namespaced so this workflow does not share layers with any future
          # workflow that also uses the GitHub Actions cache backend.
          cache-from: type=gha,scope=capforge
          cache-to: type=gha,mode=max,scope=capforge

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
