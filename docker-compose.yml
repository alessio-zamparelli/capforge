# Example capforge deployment.
#
#   mkdir -p caps state
#   sudo chown -R 10001:10001 caps state
#   docker compose up --build
#
# Then add http://<host>:8099/mcp as an MCP (Streamable HTTP) server in
# Open WebUI. Capabilities with KIND = "web" in deploy.py are served at
# http://<host>:8080/cap/<name>/ and the token-gated console lives at
# http://<host>:8080/ui/.
#
# Capabilities are git repositories. The caps directory is server-owned; the
# model clones a repository instead of sharing a terminal mount. Host paths are
# CAPFORGE_CAPS_HOST / CAPFORGE_STATE_HOST; Compose also reads .env for the
# other ${...} defaults.

services:
  capforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: capforge:local
    # To deploy the image published to GHCR instead of building, remove the
    # build block above and use:
    #   image: ghcr.io/<owner>/capforge:latest
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${CAPFORGE_PORT:-8099}:8099"
      - "${CAPFORGE_WEB_PORT:-8080}:8080"
    environment:
      # Remap the app user to the host owner of the bind mounts.
      PUID: "${PUID:-10001}"
      PGID: "${PGID:-10001}"
      # Container paths, not host paths. They must match the volumes below.
      CAPFORGE_CAPS_DIR: /var/lib/capforge/caps
      CAPFORGE_STATE_DIR: /var/lib/capforge/state
      CAPFORGE_HOST: "0.0.0.0"
      CAPFORGE_PORT: "8099"
      CAPFORGE_PATH: /mcp
      CAPFORGE_TRANSPORT: http
      # Web listener: reverse proxy for web capabilities + console. Served
      # children get --root-path /cap/<name> and CAPFORGE_ROOT_PATH; injected
      # by the server, not configured here.
      CAPFORGE_WEB_HOST: "0.0.0.0"
      CAPFORGE_WEB_PORT: "${CAPFORGE_WEB_PORT:-8080}"
      # Set a long random string to enable the console. Unset disables the
      # console and the control API; the capability proxy keeps working.
      # CAPFORGE_WEB_TOKEN: "${CAPFORGE_WEB_TOKEN}"
      CAPFORGE_WEB_UI: "${CAPFORGE_WEB_UI:-1}"
      CAPFORGE_SERVE_BOOT_TIMEOUT: "${CAPFORGE_SERVE_BOOT_TIMEOUT:-60}"
      CAPFORGE_SANDBOX: "${CAPFORGE_SANDBOX:-require}"
      CAPFORGE_PUBLIC_URL: "${CAPFORGE_PUBLIC_URL:-}"
      CAPFORGE_GIT_TOKEN_TTL: "${CAPFORGE_GIT_TOKEN_TTL:-600}"
      CAPFORGE_KEEP_TAGS: "${CAPFORGE_KEEP_TAGS:-5}"
      CAPFORGE_RUN_TIMEOUT: "${CAPFORGE_RUN_TIMEOUT:-120}"
      CAPFORGE_TEST_TIMEOUT: "${CAPFORGE_TEST_TIMEOUT:-300}"
      CAPFORGE_INSTALL_TIMEOUT: "${CAPFORGE_INSTALL_TIMEOUT:-240}"
      CAPFORGE_LOG_LEVEL: "${CAPFORGE_LOG_LEVEL:-INFO}"
    volumes:
      # Server-owned capability drafts and repositories. The model clones them.
      - "${CAPFORGE_CAPS_HOST:-./caps}:/var/lib/capforge/caps"
      # Versions, venvs and per-version data. Keep this on its own volume and
      # back it up; losing it loses every tag.
      - "${CAPFORGE_STATE_HOST:-./state}:/var/lib/capforge/state"
    # Hardening option, once you have confirmed capabilities only write under
    # CAPFORGE_DATA_DIR:
    # read_only: true
    # tmpfs:
    #   - /tmp
